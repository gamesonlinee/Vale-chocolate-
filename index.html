<!DOCTYPE html>
<html lang="pt-BR">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu Presente ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    background:
        radial-gradient(circle at top, #3b2118 0%, #180d09 45%, #080605 100%);
    font-family: Georgia, "Times New Roman", serif;
    color: #fff;
    overflow: hidden;
}

.card {
    width: 100%;
    max-width: 430px;

    /* reduzido para caber na tela */
    max-height: calc(100vh - 30px);

    padding: 28px 24px;

    text-align: center;
    border-radius: 28px;

    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);

    box-shadow:
        0 20px 60px rgba(0,0,0,0.55),
        inset 0 0 30px rgba(255,255,255,0.03);

    backdrop-filter: blur(10px);

    position: relative;
    z-index: 2;

    animation: aparecer 1.2s ease;
}

.emoji {
    font-size: 58px;
    margin-bottom: 12px;
    animation: flutuar 3s ease-in-out infinite;
}

h1 {
    font-size: 29px;
    margin-bottom: 12px;
    font-weight: normal;
}

.destaque {
    font-size: 22px;
    margin: 14px 0;
    color: #f5d0b8;
}

p {
    font-size: 17px;
    line-height: 1.5;
    color: #eee;
}

.linha {
    width: 70px;
    height: 1px;
    background: rgba(255,255,255,0.4);
    margin: 18px auto;
}

.assinatura {
    margin-top: 18px;
    font-size: 18px;
    color: #f5d0b8;
}


/* =========================
   BOTÃO
   ========================= */

#playMusic {
    display: block;

    width: 100%;

    margin-top: 20px;

    padding: 14px 16px;

    border: none;
    border-radius: 15px;

    background: linear-gradient(
        135deg,
        #f5d0b8,
        #d99b78
    );

    color: #35170d;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.35),
        0 0 15px rgba(245,208,184,0.15);

    position: relative;
    z-index: 10;
}

#playMusic:active {
    transform: scale(0.97);
}


/* =========================
   YOUTUBE
   ========================= */

#youtubePlayer {
    position: fixed;

    width: 1px;
    height: 1px;

    left: -20px;
    bottom: -20px;

    opacity: 0;

    pointer-events: none;
}


/* =========================
   CORAÇÕES
   ========================= */

.coracao {
    position: fixed;

    bottom: -40px;

    font-size: 18px;

    opacity: 0;

    animation: subir linear forwards;

    z-index: 9999;

    pointer-events: none;

    text-shadow:
        0 0 5px rgba(255,255,255,0.4),
        0 0 12px rgba(255,80,100,0.5);
}


@keyframes aparecer {

    from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


@keyframes flutuar {

    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


@keyframes subir {

    0% {
        transform:
            translateY(0)
            rotate(0deg)
            scale(0.7);

        opacity: 0;
    }

    10% {
        opacity: 0.85;
    }

    50% {
        opacity: 0.9;
    }

    100% {
        transform:
            translateY(-115vh)
            rotate(25deg)
            scale(1.3);

        opacity: 0;
    }
}

</style>
</head>

<body>

<div class="card">

    <div class="emoji">🍫</div>

    <h1>Você ganhou um presente!</h1>

    <div class="linha"></div>

    <div class="destaque">
        ❤️ VALE-CHOCOLATE ❤️
    </div>

    <p>
        Este cartão vale
        <strong>1 chocolate à sua escolha.</strong>
    </p>

    <p style="margin-top:14px;">
        Pode escolher o seu favorito.
        <br>
        Hoje a dieta está oficialmente cancelada. 😂❤️
    </p>

    <div class="linha"></div>

    <p>
        Porque momentos doces
        <br>
        merecem um chocolate à altura. 🍫
    </p>

    <div class="assinatura">
        Com amor,<br>
        <strong>Danilo ❤️</strong>
    </div>

    <button id="playMusic">
        ▶ Tocar nossa música ❤️
    </button>

</div>


<!-- MÚSICA -->
<div id="youtubePlayer"></div>


<script>

/* ================================
   MÚSICA
   Jorge & Mateus
   A Hora É Agora
   ================================ */

const videoId = "P8nYqA3NyIc";

let player = null;

const button = document.getElementById("playMusic");


/* Carrega YouTube API */

const tag = document.createElement("script");

tag.src = "https://www.youtube.com/iframe_api";

document.head.appendChild(tag);


/* YouTube pronto */

function onYouTubeIframeAPIReady() {

    player = new YT.Player("youtubePlayer", {

        height: "1",
        width: "1",

        videoId: videoId,

        playerVars: {
            autoplay: 0,
            controls: 0,
            loop: 1,
            playlist: videoId,
            playsinline: 1,
            rel: 0
        },

        events: {

            onReady: function() {

                button.innerHTML =
                    "▶ Tocar nossa música ❤️";

            },

            onStateChange: function(event) {

                if (event.data === YT.PlayerState.PLAYING) {

                    button.innerHTML =
                        "🎵 Nossa música está tocando ❤️";

                }

                if (event.data === YT.PlayerState.PAUSED) {

                    button.innerHTML =
                        "▶ Continuar nossa música ❤️";

                }

            }
        }
    });
}


/* ================================
   CLIQUE PARA TOCAR
   ================================ */

button.addEventListener("click", function() {

    if (!player) {

        button.innerHTML =
            "⏳ Carregando música...";

        return;
    }

    player.unMute();

    player.setVolume(100);

    player.playVideo();

    button.innerHTML =
        "🎵 Nossa música está tocando ❤️";

});


/* ================================
   CORAÇÕES
   ================================ */

function criarCoracao() {

    const coracao = document.createElement("div");

    coracao.className = "coracao";

    const tipos = [
        "❤️",
        "❤️",
        "❤️",
        "♡",
        "♥️",
        "💕",
        "💗"
    ];

    coracao.innerHTML =
        tipos[
            Math.floor(Math.random() * tipos.length)
        ];

    coracao.style.left =
        Math.random() * 100 + "vw";

    coracao.style.fontSize =
        (14 + Math.random() * 20) + "px";

    coracao.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    document.body.appendChild(coracao);

    setTimeout(() => {

        coracao.remove();

    }, 11000);
}


/* Mais corações */

setInterval(criarCoracao, 180);


/* Corações iniciais */

for (let i = 0; i < 15; i++) {

    setTimeout(() => {

        criarCoracao();

    }, i * 120);

}

</script>

</body>
</html>
