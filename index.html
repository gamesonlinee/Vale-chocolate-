<!DOCTYPE html>
<html lang="pt-BR">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seu Presente ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    background:
        radial-gradient(circle at top, #3b2118 0%, #180d09 45%, #080605 100%);
    font-family: Georgia, "Times New Roman", serif;
    color: #fff;
    overflow: hidden;
}

.card {
    width: 100%;
    max-width: 430px;
    padding: 45px 28px;
    text-align: center;
    border-radius: 28px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow:
        0 20px 60px rgba(0,0,0,0.55),
        inset 0 0 30px rgba(255,255,255,0.03);
    backdrop-filter: blur(10px);

    /* Mantém o cartão abaixo dos corações */
    position: relative;
    z-index: 2;

    animation: aparecer 1.2s ease;
}

.emoji {
    font-size: 68px;
    margin-bottom: 20px;
    animation: flutuar 3s ease-in-out infinite;
}

h1 {
    font-size: 34px;
    margin-bottom: 18px;
    font-weight: normal;
}

.destaque {
    font-size: 24px;
    margin: 20px 0;
    color: #f5d0b8;
}

p {
    font-size: 18px;
    line-height: 1.7;
    color: #eee;
}

.linha {
    width: 80px;
    height: 1px;
    background: rgba(255,255,255,0.4);
    margin: 28px auto;
}

.assinatura {
    margin-top: 30px;
    font-size: 20px;
    color: #f5d0b8;
}

/* CORAÇÕES POR CIMA DE TUDO */
.coracao {
    position: fixed;
    bottom: -40px;
    font-size: 18px;
    opacity: 0;
    animation: subir linear forwards;

    /* Fica na frente do cartão */
    z-index: 9999;

    pointer-events: none;

    /* Leve brilho */
    text-shadow:
        0 0 5px rgba(255,255,255,0.4),
        0 0 12px rgba(255,80,100,0.5);
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

@keyframes flutuar {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

@keyframes subir {
    0% {
        transform: translateY(0) rotate(0deg) scale(0.7);
        opacity: 0;
    }

    10% {
        opacity: 0.85;
    }

    50% {
        opacity: 0.9;
    }

    100% {
        transform: translateY(-115vh) rotate(25deg) scale(1.3);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="emoji">🍫</div>

    <h1>Você ganhou um presente!</h1>

    <div class="linha"></div>

    <div class="destaque">
        ❤️ VALE-CHOCOLATE ❤️
    </div>

    <p>
        Este cartão vale
        <strong>1 chocolate à sua escolha.</strong>
    </p>

    <p style="margin-top:18px;">
        Pode escolher o seu favorito.
        <br>
        Hoje a dieta está oficialmente cancelada. 😂❤️
    </p>

    <div class="linha"></div>

    <p>
        Porque momentos doces
        <br>
        merecem um chocolate à altura. 🍫
    </p>

    <div class="assinatura">
        Com amor,<br>
        <strong>Danilo ❤️</strong>
    </div>

</div>


<!-- Música: Jorge & Mateus — A Hora É Agora -->

<iframe
    width="0"
    height="0"
    src="https://www.youtube.com/embed/P8nYqA3NyIc?autoplay=1&loop=1&playlist=P8nYqA3NyIc"
    title="A Hora É Agora - Jorge & Mateus"
    frameborder="0"
    allow="autoplay; encrypted-media">
</iframe>


<script>

/* ================================
   CORAÇÕES FLUTUANDO
   ================================ */

function criarCoracao() {

    const coracao = document.createElement("div");

    coracao.className = "coracao";

    /* Mais variedade de corações */
    const tipos = [
        "❤️",
        "❤️",
        "❤️",
        "♡",
        "♥️",
        "💕",
        "💗"
    ];

    coracao.innerHTML =
        tipos[Math.floor(Math.random() * tipos.length)];

    /* Posição horizontal aleatória */
    coracao.style.left =
        Math.random() * 100 + "vw";

    /* Tamanhos variados */
    coracao.style.fontSize =
        (14 + Math.random() * 20) + "px";

    /* Velocidades variadas */
    coracao.style.animationDuration =
        (5 + Math.random() * 5) + "s";

    /* Pequeno atraso aleatório */
    coracao.style.animationDelay =
        (Math.random() * 0.5) + "s";

    document.body.appendChild(coracao);

    setTimeout(() => {
        coracao.remove();
    }, 11000);
}


/* =================================
   MAIS CORAÇÕES NA TELA
   ================================= */

/* Antes: 1 coração a cada 700ms
   Agora: vários corações */
setInterval(criarCoracao, 180);


/* Cria vários imediatamente ao abrir */
for (let i = 0; i < 12; i++) {

    setTimeout(() => {
        criarCoracao();
    }, i * 120);

}

</script>

</body>
</html>
